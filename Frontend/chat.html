<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="chat.css">
    <script src="JS Files/illustations.js"></script>
    <script src="math.js"></script>
</head>
<body>

<!-- CHAT SECTION -->
<div id="chatPage" class="page active">
    <div class="container">
        <h1>Math Tutor</h1>
        <p>Ask me any math question!</p>

        <input type="text" id="mathQuestion" placeholder="Example: x^4 - 10x^2 + 9 = 0">
        <button onclick="askTutor()">Ask Tutor</button>

        <div id="responseContainer" class="hidden">
            <h3>Tutor's Answer:</h3>
            <div id="replyText"></div>
        </div>
    </div>

    <button onclick="openWhiteboard()">Toggle Canvas</button>
</div>


<!-- WHITEBOARD SECTION -->
<div id="canvasPage" class="page">

    <div class="toolbar">
        <div class="whiteboard-heading">
            <h2>Solution whiteboard</h2>
            <p>Select a step to explore how it follows.</p>
        </div>
        <div class="whiteboard-controls">
            <label class="step-select-control">
                <input id="stepSelectionToggle" type="checkbox"
                       onchange="setSelectionMode(this.checked)">
                <span>Select a step</span>
            </label>
            <button id="explainStepButton" onclick="explainSelectedStep()" disabled>
                Explain this step
            </button>
            <button class="secondary-button" onclick="clearCanvas()">Clear board</button>
            <button class="secondary-button" onclick="openChat()">Back to chat</button>
        </div>
        <p id="selectedStepInfo" aria-live="polite">No step selected.</p>
        <p id="stepExplanation" aria-live="polite"></p>
    </div>
    <div id="canvasWrapper">
    
    <canvas id="board" width="800" height="400"></canvas>
    </div>
</div>

</body>
