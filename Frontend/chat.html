<head>
    <link rel="stylesheet" type="text/css" href="chat.css">
    <script src="math.js"></script>
</head>
<body>

<!-- CHAT SECTION -->
<div id="chatPage" class="page active">
    <div class="container">
        <h1>Math Tutor</h1>
        <p>Ask me any math question!</p>

        <input type="text" id="mathQuestion" placeholder="Example: x^4 - 10x^2 + 9 = 0">
        <button onclick="askTutor()">Ask Tutor</button>

        <div id="responseContainer" class="hidden">
            <h3>Tutor's Answer:</h3>
            <div id="replyText"></div>
        </div>
    </div>

    <button onclick="openWhiteboard()">Toggle Canvas</button>
</div>


<!-- WHITEBOARD SECTION -->
<div id="canvasPage" class="page">

    <div class="toolbar">
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="openChat()">Back to Chat</button>
    </div>
    <div id="canvasWrapper">
    
    <canvas id="board" width="800" height="400"></canvas>
    </div>
</div>

</body>
